<g>
<path class="arrow" d="M370,256 C410,276 320,114 280,134" marker-end="url(#state-arrow)"/>
<text font-size="11" x="331" y="195">
send(msg)
</text>
</g>
<g>
<line class="arrow" marker-end="url(#state-arrow)" x1="280" x2="370" y1="170" y2="220"/>
